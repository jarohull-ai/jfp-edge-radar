name: Security Audit & Supply Chain Scanning

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  audit:
    name: Dependency Vulnerability Audit (Cargo Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Audit
        run: cargo audit
