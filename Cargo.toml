[package]
name = "jfp-edge-radar"
version = "0.4.2"
edition = "2021"
authors = ["jarohull-ai"]
description = "Deterministic Edge Radar & Reverse Proxy Gateway for sniffing autonomous AI agents, mutating botnets, and PHP-2-Shell (CVE-2026-109618/19) memory exploits."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/jarohull-ai/jfp-edge-radar"
homepage = "https://github.com/jarohull-ai/jfp-edge-radar"
keywords = ["security", "reverse-proxy", "defense", "honeypot", "php-security"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "jfp-edge-radar"
path = "src/main.rs"

[lib]
name = "jfp_edge_radar"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
bytes = "1.6"
ipnet = "2.12"
dashmap = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
